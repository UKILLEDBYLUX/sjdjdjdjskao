name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Build all mods
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p work out
          found=0

          build_dir() {
            local dir="$1" name="$2"
            echo "::group::Сборка $name ($dir)"
            (cd "$dir" && gradle build --console=plain)
            echo "::endgroup::"
            mkdir -p "out/$name"
            for jar in "$dir"/build/libs/*.jar; do
              case "$jar" in
                *-sources.jar|*-dev.jar) continue ;;
              esac
              cp "$jar" "out/$name/"
            done
            found=$((found + 1))
          }

          # Проект лежит прямо в корне репозитория
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            build_dir "." "root"
          fi

          # Проекты, залитые как zip
          for z in *.zip; do
            name="${z%.zip}"
            mkdir -p "work/$name"
            unzip -q "$z" -d "work/$name"
            settings="$(find "work/$name" \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
            if [ -z "$settings" ]; then
              echo "::warning::В $z нет settings.gradle, пропускаю"
              continue
            fi
            build_dir "$(dirname "$settings")" "$name"
          done

          if [ "$found" -eq 0 ]; then
            echo "::error::Не найдено ни одного проекта (нет ни settings.gradle, ни zip с проектом)"
            exit 1
          fi

          echo "Готовые файлы:"
          find out -name "*.jar"

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: mods-1.21.4
          path: out
          if-no-files-found: error
